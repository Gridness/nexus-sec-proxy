name: nexus-sec-proxy-e2e

x-scanner-cache-env: &scanner-cache-env
  TRIVY_CACHE_DIR: /var/cache/trivy

x-defectdojo-env: &defectdojo-env
  DD_DATABASE_URL: postgresql://defectdojo:defectdojo@defectdojo-postgres:5432/defectdojo
  DD_CELERY_BROKER_URL: redis://defectdojo-valkey:6379/0
  DD_SECRET_KEY: ${DEFECTDOJO_SECRET_KEY:-e2e-defectdojo-secret-key-do-not-use-in-production}
  DD_CREDENTIAL_AES_256_KEY: ${DEFECTDOJO_CREDENTIAL_AES_256_KEY:-0123456789abcdef0123456789abcdef}
  DD_DATABASE_READINESS_TIMEOUT: 60
  DD_DEDUPLICATION_ALGORITHM_PER_PARSER: '{"Nexus Security Proxy Scan (Generic Findings Import)":"unique_id_from_tool"}'

services:
  nexus-sec-proxy:
    image: nexus-sec-proxy:${NEXUS_SEC_PROXY_IMAGE_TAG:-local}
    build:
      context: .
      target: runtime
      args:
        RUST_VERSION: ${RUST_VERSION:-1.95.0}
        DEBIAN_VERSION: ${DEBIAN_VERSION:-bookworm}
        TRIVY_VERSION: ${TRIVY_VERSION:-0.71.0}
        HELM_VERSION: ${HELM_VERSION:-3.18.4}
        YANDEX_MESSENGER_FEATURE: ${NEXUS_SEC_PROXY_YANDEX_MESSENGER_FEATURE:-true}
        DEFECTDOJO_FEATURE: ${NEXUS_SEC_PROXY_DEFECTDOJO_FEATURE:-true}
        VERSION: ${NEXUS_SEC_PROXY_VERSION:-0.1.0} # x-release-please-version
        VCS_REF: ${NEXUS_SEC_PROXY_VCS_REF:-unknown}
        BUILD_DATE: ${NEXUS_SEC_PROXY_BUILD_DATE:-unknown}
    init: true
    restart: unless-stopped
    depends_on:
      defectdojo:
        condition: service_healthy
      nexus:
        condition: service_healthy
    network_mode: service:defectdojo
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      <<: *scanner-cache-env
      HOME: /home/nonroot
      RUST_LOG: ${RUST_LOG:-nexus_sec_proxy=info}
      NEXUS_SEC_PROXY_BIND_ADDR: 0.0.0.0:3000
      NEXUS_SEC_PROXY_NEXUS_BASE_URL: ${NEXUS_SEC_PROXY_NEXUS_BASE_URL:-http://nexus:8081}
      NEXUS_SEC_PROXY_NEXUS_USERNAME: ${NEXUS_SEC_PROXY_NEXUS_USERNAME:-}
      NEXUS_SEC_PROXY_NEXUS_PASSWORD: ${NEXUS_SEC_PROXY_NEXUS_PASSWORD:-}
      NEXUS_SEC_PROXY_NEXUS_PASSWORD_FILE: ${NEXUS_SEC_PROXY_NEXUS_PASSWORD_FILE:-}
      NEXUS_SEC_PROXY_DOCKER_REGISTRY_BASE_URL: ${NEXUS_SEC_PROXY_DOCKER_REGISTRY_BASE_URL:-}
      NEXUS_SEC_PROXY_DOCKER_REPOSITORY_NAME: ${NEXUS_SEC_PROXY_DOCKER_REPOSITORY_NAME:-}
      NEXUS_SEC_PROXY_REPOSITORY_REFRESH_INTERVAL_SECS: ${NEXUS_SEC_PROXY_REPOSITORY_REFRESH_INTERVAL_SECS:-60}
      NEXUS_SEC_PROXY_OSV_ECOSYSTEM_OVERRIDES: ${NEXUS_SEC_PROXY_OSV_ECOSYSTEM_OVERRIDES:-}
      NEXUS_SEC_PROXY_OSV_API_URL: ${NEXUS_SEC_PROXY_OSV_API_URL:-https://api.osv.dev/v1/query}
      NEXUS_SEC_PROXY_POLICY_FILE: ${NEXUS_SEC_PROXY_POLICY_FILE:-}
      NEXUS_SEC_PROXY_ADMIN_TOKEN: ${NEXUS_SEC_PROXY_ADMIN_TOKEN:-}
      NEXUS_SEC_PROXY_YANDEX_MESSENGER_TOKEN: ${NEXUS_SEC_PROXY_YANDEX_MESSENGER_TOKEN:-}
      NEXUS_SEC_PROXY_YANDEX_MESSENGER_TOKEN_FILE: ${NEXUS_SEC_PROXY_YANDEX_MESSENGER_TOKEN_FILE:-}
      NEXUS_SEC_PROXY_YANDEX_MESSENGER_TEMPLATE_FILE: ${NEXUS_SEC_PROXY_YANDEX_MESSENGER_TEMPLATE_FILE:-}
      NEXUS_SEC_PROXY_YANDEX_MESSENGER_API_URL: ${NEXUS_SEC_PROXY_YANDEX_MESSENGER_API_URL:-https://botapi.messenger.yandex.net}
      NEXUS_SEC_PROXY_YANDEX_MESSENGER_ENABLED: ${NEXUS_SEC_PROXY_YANDEX_MESSENGER_ENABLED:-}
      NEXUS_SEC_PROXY_DEFECTDOJO_ENABLED: ${NEXUS_SEC_PROXY_DEFECTDOJO_ENABLED:-false}
      NEXUS_SEC_PROXY_DEFECTDOJO_URL: ${NEXUS_SEC_PROXY_DEFECTDOJO_URL:-}
      NEXUS_SEC_PROXY_DEFECTDOJO_TOKEN: ${NEXUS_SEC_PROXY_DEFECTDOJO_TOKEN:-}
      NEXUS_SEC_PROXY_DEFECTDOJO_TOKEN_FILE: ${NEXUS_SEC_PROXY_DEFECTDOJO_TOKEN_FILE:-}
      NEXUS_SEC_PROXY_DEFECTDOJO_ENGAGEMENT_ID: ${NEXUS_SEC_PROXY_DEFECTDOJO_ENGAGEMENT_ID:-}
      NEXUS_SEC_PROXY_TRUST_BASE_URL: ${NEXUS_SEC_PROXY_TRUST_BASE_URL:-http://localhost:${NEXUS_SEC_PROXY_PORT:-3000}}
      NEXUS_SEC_PROXY_TRUST_REPORT_DIR: /var/lib/nexus-sec-proxy/trust-reports
      NEXUS_SEC_PROXY_TRUST_REPORT_RETENTION_DAYS: ${NEXUS_SEC_PROXY_TRUST_REPORT_RETENTION_DAYS:-30}
      NEXUS_SEC_PROXY_LOG_JSON: ${NEXUS_SEC_PROXY_LOG_JSON:-false}
      NEXUS_SEC_PROXY_MINIMUM_BLOCKING_SEVERITY: ${NEXUS_SEC_PROXY_MINIMUM_BLOCKING_SEVERITY:-HIGH}
      NEXUS_SEC_PROXY_ALLOWED_VULNERABILITY_IDS: ${NEXUS_SEC_PROXY_ALLOWED_VULNERABILITY_IDS:-}
      NEXUS_SEC_PROXY_MAX_TOTAL_VULNERABILITIES: ${NEXUS_SEC_PROXY_MAX_TOTAL_VULNERABILITIES:-}
      NEXUS_SEC_PROXY_MAX_LOW_VULNERABILITIES: ${NEXUS_SEC_PROXY_MAX_LOW_VULNERABILITIES:-}
      NEXUS_SEC_PROXY_MAX_MEDIUM_VULNERABILITIES: ${NEXUS_SEC_PROXY_MAX_MEDIUM_VULNERABILITIES:-}
      NEXUS_SEC_PROXY_MAX_HIGH_VULNERABILITIES: ${NEXUS_SEC_PROXY_MAX_HIGH_VULNERABILITIES:-}
      NEXUS_SEC_PROXY_MAX_CRITICAL_VULNERABILITIES: ${NEXUS_SEC_PROXY_MAX_CRITICAL_VULNERABILITIES:-}
      NEXUS_SEC_PROXY_FAIL_OPEN: ${NEXUS_SEC_PROXY_FAIL_OPEN:-true}
      NEXUS_SEC_PROXY_UNSUPPORTED_TARGET_POLICY: ${NEXUS_SEC_PROXY_UNSUPPORTED_TARGET_POLICY:-allow}
      NEXUS_SEC_PROXY_CACHE_ALLOWED_TTL_SECS: ${NEXUS_SEC_PROXY_CACHE_ALLOWED_TTL_SECS:-86400}
      NEXUS_SEC_PROXY_CACHE_BLOCKED_TTL_SECS: ${NEXUS_SEC_PROXY_CACHE_BLOCKED_TTL_SECS:-3600}
      NEXUS_SEC_PROXY_CACHE_MAX_CAPACITY: ${NEXUS_SEC_PROXY_CACHE_MAX_CAPACITY:-100000}
      NEXUS_SEC_PROXY_REQUEST_TIMEOUT_SECS: ${NEXUS_SEC_PROXY_REQUEST_TIMEOUT_SECS:-30}
      NEXUS_SEC_PROXY_ARTIFACT_SCANNER_FORMATS: ${NEXUS_SEC_PROXY_ARTIFACT_SCANNER_FORMATS:-}
      NEXUS_SEC_PROXY_ARTIFACT_SCANNER_SKIP_DB_UPDATE: ${NEXUS_SEC_PROXY_ARTIFACT_SCANNER_SKIP_DB_UPDATE:-true}
      NEXUS_SEC_PROXY_ARTIFACT_SCANNER_OFFLINE: ${NEXUS_SEC_PROXY_ARTIFACT_SCANNER_OFFLINE:-true}
      NEXUS_SEC_PROXY_ARTIFACT_SCANNER_TIMEOUT_SECS: ${NEXUS_SEC_PROXY_ARTIFACT_SCANNER_TIMEOUT_SECS:-300}
      NEXUS_SEC_PROXY_ARTIFACT_SCAN_MAX_BYTES: ${NEXUS_SEC_PROXY_ARTIFACT_SCAN_MAX_BYTES:-536870912}
      NEXUS_SEC_PROXY_ARTIFACT_SCANNER_CONCURRENCY: ${NEXUS_SEC_PROXY_ARTIFACT_SCANNER_CONCURRENCY:-2}
      NEXUS_SEC_PROXY_ARTIFACT_TMP_DIR: /var/tmp/nexus-sec-proxy
    volumes:
      - ${NEXUS_SEC_PROXY_POLICY_DIR:-./policy}:/etc/nexus-sec-proxy:ro
      - artifact-tmp:/var/tmp/nexus-sec-proxy
      - trust-reports:/var/lib/nexus-sec-proxy/trust-reports
      - trivy-cache:/var/cache/trivy
    healthcheck:
      test:
        [
          "CMD",
          "/busybox",
          "wget",
          "-q",
          "-O",
          "-",
          "http://127.0.0.1:3000/healthz",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  scanner-db-updater:
    image: nexus-sec-proxy-scanner-db-updater:${NEXUS_SEC_PROXY_IMAGE_TAG:-local}
    build:
      context: .
      target: scanner-db-updater
      args:
        DEBIAN_VERSION: ${DEBIAN_VERSION:-bookworm}
        TRIVY_VERSION: ${TRIVY_VERSION:-0.71.0}
        HELM_VERSION: ${HELM_VERSION:-3.18.4}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      <<: *scanner-cache-env
      HOME: /home/nonroot
      NEXUS_SEC_PROXY_SCANNER_DB_UPDATE_INTERVAL_SECS: ${NEXUS_SEC_PROXY_SCANNER_DB_UPDATE_INTERVAL_SECS:-21600}
      NEXUS_SEC_PROXY_SCANNER_DB_RETRY_INTERVAL_SECS: ${NEXUS_SEC_PROXY_SCANNER_DB_RETRY_INTERVAL_SECS:-300}
    volumes:
      - trivy-cache:/var/cache/trivy
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  defectdojo:
    image: defectdojo/defectdojo-nginx:${DEFECTDOJO_VERSION:-3.1.200}
    init: true
    restart: unless-stopped
    depends_on:
      defectdojo-uwsgi:
        condition: service_started
    environment:
      DD_UWSGI_HOST: defectdojo-uwsgi
      DD_UWSGI_PORT: 3031
    ports:
      - "8080:8080"
      - "${NEXUS_SEC_PROXY_PORT:-3000}:3000"
    volumes:
      - defectdojo-media:/usr/share/nginx/html/media
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/login",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  defectdojo-uwsgi:
    image: defectdojo/defectdojo-django:${DEFECTDOJO_VERSION:-3.1.200}
    init: true
    restart: unless-stopped
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
      defectdojo-postgres:
        condition: service_started
      defectdojo-valkey:
        condition: service_started
    entrypoint:
      [
        "/wait-for-it.sh",
        "defectdojo-postgres:5432",
        "-t",
        "60",
        "--",
        "/entrypoint-uwsgi.sh",
      ]
    environment:
      <<: *defectdojo-env
      DD_ALLOWED_HOSTS: "*"
      DD_ADMIN_USER: ${DEFECTDOJO_ADMIN_USER:-admin}
      DD_ADMIN_PASSWORD: ${DEFECTDOJO_ADMIN_PASSWORD:-e2e-admin-password}
    volumes:
      - defectdojo-media:/app/media
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  defectdojo-celerybeat:
    image: defectdojo/defectdojo-django:${DEFECTDOJO_VERSION:-3.1.200}
    init: true
    restart: unless-stopped
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
      defectdojo-postgres:
        condition: service_started
      defectdojo-valkey:
        condition: service_started
    entrypoint:
      [
        "/wait-for-it.sh",
        "defectdojo-postgres:5432",
        "-t",
        "60",
        "--",
        "/entrypoint-celery-beat.sh",
      ]
    environment:
      <<: *defectdojo-env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  defectdojo-celeryworker:
    image: defectdojo/defectdojo-django:${DEFECTDOJO_VERSION:-3.1.200}
    init: true
    restart: unless-stopped
    depends_on:
      defectdojo-initializer:
        condition: service_completed_successfully
      defectdojo-postgres:
        condition: service_started
      defectdojo-valkey:
        condition: service_started
    entrypoint:
      [
        "/wait-for-it.sh",
        "defectdojo-postgres:5432",
        "-t",
        "60",
        "--",
        "/entrypoint-celery-worker.sh",
      ]
    environment:
      <<: *defectdojo-env
    volumes:
      - defectdojo-media:/app/media
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  defectdojo-initializer:
    image: defectdojo/defectdojo-django:${DEFECTDOJO_VERSION:-3.1.200}
    depends_on:
      defectdojo-postgres:
        condition: service_started
    entrypoint:
      [
        "/wait-for-it.sh",
        "defectdojo-postgres:5432",
        "-t",
        "60",
        "--",
        "/entrypoint-initializer.sh",
      ]
    environment:
      <<: *defectdojo-env
      DD_ADMIN_USER: ${DEFECTDOJO_ADMIN_USER:-admin}
      DD_ADMIN_MAIL: ${DEFECTDOJO_ADMIN_EMAIL:-admin@defectdojo.local}
      DD_ADMIN_FIRST_NAME: E2E
      DD_ADMIN_LAST_NAME: Admin
      DD_ADMIN_PASSWORD: ${DEFECTDOJO_ADMIN_PASSWORD:-e2e-admin-password}
      DD_INITIALIZE: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  defectdojo-postgres:
    image: postgres:${DEFECTDOJO_POSTGRES_VERSION:-18.4-alpine}
    restart: unless-stopped
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: defectdojo
    volumes:
      - defectdojo-postgres:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  defectdojo-valkey:
    image: valkey/valkey:${DEFECTDOJO_VALKEY_VERSION:-9.1.0-alpine}
    restart: unless-stopped
    volumes:
      - defectdojo-valkey:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nexus:
    image: sonatype/nexus3:${NEXUS_OSS_IMAGE_TAG:-3.94.0}
    init: true
    restart: unless-stopped
    ports:
      - "${NEXUS_OSS_PORT:-8081}:8081"
    volumes:
      - nexus-data:/nexus-data
    environment:
      INSTALL4J_ADD_VM_PARAMS: ${NEXUS_OSS_JAVA_OPTS:--Xms512m -Xmx1024m -XX:MaxDirectMemorySize=1024m}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8081/",
        ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  artifact-tmp:
  defectdojo-media:
  defectdojo-postgres:
  defectdojo-valkey:
  nexus-data:
  trust-reports:
  trivy-cache:
